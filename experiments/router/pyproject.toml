[project]
name = "darkcore"
version = "0.2.0"
description = "dark-core — patchwork's standalone tiered-cascade router (spec 0001 data plane)."
requires-python = ">=3.11,<3.14"
# Floors = the versions the v0.2 bench + seam verification ran against
# (2026-07-17); uv.lock pins exact. mlx-lm capped at minor: stream_generate's
# response shape is behavior-sensitive.
dependencies = [
    "mlx-lm>=0.31.3,<0.32",
    "fastapi>=0.138.0",
    "uvicorn>=0.49.0",
    "rich>=15.0.0",
    "numpy>=2.4.0",
]

[project.scripts]
darkcore = "darkcore.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # fastapi TestClient transport
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["darkcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
