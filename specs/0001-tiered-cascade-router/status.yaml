id: "0001"
slug: "tiered-cascade-router"
title: "Tiered cascade router — programmatic prefilter → kNN tier predictor → verify-and-escalate"
state: "draft"
owner: "unassigned"
created: "2026-07-15"
updated: "2026-07-16"

verifier:
  kind: "harness"
  command: >
    python experiments/router/verify.py
    --battery experiments/router/battery.jsonl
    --report experiments/router/report.json
    --assert-thresholds
  requires_tests: true
depends_on: []
blocks: []
targets:
  - router
paths:
  - "experiments/router/**"
  - "logs/router/**"
labels:
  - "routing"
  - "cascade"
  - "observability"
  - "cost-quality"
metadata:
  motivation: >
    First composition primitive for patchwork. Established this session: three
    local tiers (Bonsai 1.7B/8B/27B ternary) with a hard failure mode — the 1.7B
    is confidently wrong on judgment tasks — which forces a cascade (verify +
    escalate), not a bare upfront router.
  notes: >
    Four requirements per operator direction: prefilter → kNN predictor → cascade,
    plus observability as a first-class, cross-cutting requirement (a router we
    cannot see into cannot be judged, debugged, tuned, or grown). Layer 2 follows
    arXiv:2505.12601 (kNN >= learned routers, no training; add a tier by dropping
    exemplars). Seed exemplars = this session's eval battery.

    Design decisions are RESOLVED (embedder bge-small; per-class verifiers matched
    to failure type; per-class λ from one principle — λ inversely tracks verifier
    reliability); full rationale + expected failure modes in decisions.md. State
    stays "draft" pending EMPIRICAL closure only: validate embedder (V2), tune
    per-class verifier thresholds against the known T0 failure outputs, run the λ
    sweep. Flip to "ready" after that. Paper PDF: references/.
  references:
    - "decisions.md — design decisions + expected failure modes (read before redesign)"
    - "arXiv:2505.12601 — kNN >= learned routers (PDF in references/)"
    - "arXiv:2506.16655 — Arch-Router; arXiv:2603.04445 — routing/cascade survey"
    - "spark/MODEL-EVAL-2026-07-15.md — tier capability matrix + failure modes"
    - "spark/spikes/human-emotion-eval-skill.md — the battery that seeds the exemplars"
    - "../CLAUDE.md — mandatory Runtime Logging standard + PII rule (observability)"
