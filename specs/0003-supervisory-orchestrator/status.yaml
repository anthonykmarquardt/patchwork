metadata:
  motivation: >
    The supervisory half of the control plane. Firm-based/hierarchical. Consumes
    alarms (certificate-backed failures) and performs sampled volitional inspection
    of the no-certificate classes; actuates policy overrides via the control
    surface. Out-of-band, never in the request path.
  notes: >
    SCAFFOLD only — role + decisions captured, full planning next session. Hard
    problem: the attention budget — routing its own (expensive) inspection
    (recursive routing). Silent-failure coverage is sampled, not guaranteed.
    See docs/routing-architecture.md §3, §11.
